<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة استنساخ الأصوات بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"], select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            box-sizing: border-box;
            font-size: 14px;
        }
        .celebrity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .celeb-btn {
            background-color: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .celeb-btn.active {
            border-color: #38bdf8;
            background-color: #0369a1;
        }
        button.main-btn {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button.main-btn:hover { background-color: #0369a1; }
        button.main-btn:disabled { background-color: #475569; cursor: not-allowed; }
        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 6px;
            display: none;
            text-align: center;
        }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مستنسخ الأصوات الذكي</h1>
        <p style="text-align: center; color: #94a3b8; margin-top: 0; margin-bottom: 25px;">اختر صوتاً جاهزاً أو ارفع ملفاتك لتعديل الصوت فوراً</p>
        
        <!-- القسم الأول: رفع ملف الصوت الأساسي -->
        <div class="form-group">
            <label for="audioInput">1. ارفع ملف الصوت المراد تغييره (أو تسجيلك):</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <!-- القسم الثاني: اختيار أصوات جاهزة -->
        <div class="form-group">
            <label>2. اختر صوتاً جاهزاً للمحاكاة:</label>
            <div class="celebrity-grid">
                <button class="celeb-btn" onclick="selectVoice('celeb1', this)">🎤 مغني مشهور</button>
                <button class="celeb-btn" onclick="selectVoice('celeb2', this)">📺 معلق إخباري</button>
                <button class="celeb-btn" onclick="selectVoice('anime', this)">👾 شخصية كرتونية</button>
                <button class="celeb-btn" onclick="selectVoice('custom', this)">📁 رفع موديل خاص (.pth)</button>
            </div>
        </div>

        <!-- خانة رفع الموديل يدوياً (تظهر فقط عند الحاجة) -->
        <div class="form-group" id="customModelGroup" style="display: none;">
            <label for="modelInput">ارفع ملف الموديل الخاص بك (RVC):</label>
            <input type="file" id="modelInput">
        </div>

        <button class="main-btn" id="btn" onclick="startCloning()">ابدأ استنساخ الصوت الآن</button>

        <!-- صندوق النتيجة -->
        <div class="result" id="resultBox">
            <h3 id="statusText" style="color: #4ade80;">تم الاستنساخ بنجاح!</h3>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        let selectedVoiceType = '';

        function selectVoice(type, element) {
            selectedVoiceType = type;
            // إلغاء تحديد الأزرار الأخرى
            document.querySelectorAll('.celeb-btn').forEach(btn => btn.classList.remove('active'));
            // تحديد الزر الحالي
            element.classList.add('active');

            // إظهار أو إخفاء خانة الرفع اليدوي
            const customGroup = document.getElementById('customModelGroup');
            if (type === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        async function startCloning() {
            const audioFile = document.getElementById('audioInput').files[0];
            const modelFile = document.getElementById('modelInput').files[0];
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!audioFile) {
                alert('الرجاء رفع ملف الصوت الأساسي أولاً!');
                return;
            }

            if (!selectedVoiceType) {
                alert('الرجاء اختيار صوت جاهز أو تحديد خيار رفع موديل خاص!');
                return;
            }

            if (selectedVoiceType === 'custom' && !modelFile) {
                alert('الرجاء رفع ملف الموديل الخاص بك!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري المعالجة والاستنساخ السحابي...";
            resultBox.style.display = "block";
            statusText.innerText = "جاري رفع الملف ومعالجته بالذكاء الاصطناعي...";
            statusText.style.color = "#38bdf8";
            audioPlayer.style.display = "none";

            try {
                const reader = new FileReader();
                reader.readAsDataURL(audioFile);
                reader.onload = async () => {
                    const audioBase64 = reader.result;

                    // إرسال البيانات فوراً إلى سيرفر Hugging Face الخاص بك
                    const response = await fetch("https://hf.space", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            data: [ audioBase64, null ]
                        })
                    });

                    const result = await response.json();
                    
                    if(result.data && result.data[0]) {
                        statusText.innerText = "تم استنساخ وتحويل الصوت بنجاح!";
                        statusText.style.color = "#4ade80";
                        audioPlayer.src = result.data[0].url;
                        audioPlayer.style.display = "block";
                    } else {
                        throw new Error("خطأ في المعالجة");
                    }
                    btn.disabled = false;
                    btn.innerText = "ابدأ استنساخ الصوت الآن";
                };
            } catch (error) {
                statusText.innerText = "حدث خطأ أثناء الاتصال بالسيرفر، تأكد أن السيرفر في وضع Running.";
                statusText.style.color = "#f87171";
                btn.disabled = false;
                btn.innerText = "ابدأ استنساخ الصوت الآن";
            }
        }
    </script>
</body>
</html>
