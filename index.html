<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة استنساخ الأصوات المتكاملة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 24px; }
        .form-group { margin-bottom: 20px; background-color: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #e2e8f0; }
        input[type="file"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        button {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .main-btn { background-color: #0284c7; margin-top: 10px; }
        .main-btn:hover { background-color: #0369a1; }
        .sec-btn { background-color: #10b981; }
        .sec-btn:hover { background-color: #059669; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 6px;
            display: none;
            text-align: center;
            border: 1px solid #4ade80;
        }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مستنسخ الأصوات & دمج الأغاني</h1>
        <p style="text-align: center; color: #94a3b8; margin-top: 0; margin-bottom: 25px;">ارفع أغنيتك، اختر ملفات الموديل الفعلي، وشغل المعاينة الصوتية</p>
        
        <!-- 1. رفع الأغنية أو ملف الصوت -->
        <div class="form-group">
            <label for="audioInput">1. ارفع ملف الأغنية المراد تحويلها:</label>
            <input type="file" id="audioInput" accept="audio/*">
            
            <div class="checkbox-group">
                <input type="checkbox" id="separateMusic">
                <label for="separateMusic" style="margin: 0; font-weight: normal; color: #94a3b8;">تفعيل خيار فصل الموسيقى عن صوت المغني الأصلي</label>
            </div>
        </div>

        <!-- 2. إدارة وحفظ الموديلات -->
        <div class="form-group">
            <label>2. إدارة موديلات الصوت الفعالة (RVC):</label>
            
            <select id="modelSelect">
                <option value="">-- اختر موديل صوت محفوظ --</option>
            </select>

            <label style="font-size: 13px; color: #94a3b8; margin-top: 10px;">ارفع ملف الموديل الأساسي (.pth):</label>
            <input type="file" id="pthInput" accept=".pth">

            <label style="font-size: 13px; color: #94a3b8;">ارفع ملف المؤشر الاختياري (.index):</label>
            <input type="file" id="indexInput" accept=".index">

            <input type="text" id="modelNameInput" placeholder="اكتب اسماً للموديل (مثلاً: حسام الرسام الأصلي)">
            
            <button type="button" class="sec-btn" onclick="saveModelLocal()">حفظ وتثبيت الموديل في القائمة</button>
        </div>

        <button class="main-btn" id="btn" onclick="startCloningProcess()">ابدأ المعالجة وتشغيل المعاينة الفورية</button>

        <!-- صندوق النتيجة والمعاينة الصوتية -->
        <div class="result" id="resultBox">
            <h3 id="statusText" style="color: #4ade80; margin: 0;">جاري تشغيل المعاينة الصخرية...</h3>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        let savedModels = JSON.parse(localStorage.getItem('saved_rvc_models')) || [];
        updateModelDropdown();

        function saveModelLocal() {
            const pthFile = document.getElementById('pthInput').files[0];
            const modelName = document.getElementById('modelNameInput').value.trim();

            if (!pthFile || !modelName) {
                alert('الرجاء اختيار ملف الموديل .pth وكتابة اسم له لحفظه بنجاح!');
                return;
            }

            const newModel = { id: Date.now(), name: modelName };
            savedModels.push(newModel);
            localStorage.setItem('saved_rvc_models', JSON.stringify(savedModels));

            alert(`تم حفظ وتثبيت موديل "${modelName}" في قائمتك بنجاح!`);
            document.getElementById('modelNameInput').value = '';
            updateModelDropdown();
        }

        function updateModelDropdown() {
            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option value="">-- اختر موديل صوت محفوظ --</option>';
            savedModels.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.innerText = model.name;
                select.appendChild(option);
            });
        }

        async function startCloningProcess() {
            const audioFile = document.getElementById('audioInput').files[0];
            const selectedModel = document.getElementById('modelSelect').value;
            const separateMusic = document.getElementById('separateMusic').checked;
            
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!audioFile) {
                alert('الرجاء رفع ملف الأغنية أولاً للمعاينة!');
                return;
            }

            if (!selectedModel) {
                alert('الرجاء اختيار الموديل المحفوظ الذي تريد استخدامه من القائمة!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري معالجة ورفع الملفات الحقيقية للـ API...";
            resultBox.style.display = "block";
            statusText.innerText = "يتصل السيرفر الآن بالذكاء الاصطناعي... يرجى الانتظار لصناعة ملف المعاينة الصوتية.";
            statusText.style.color = "#38bdf8";
            audioPlayer.style.display = "none";

            try {
                const reader = new FileReader();
                reader.readAsDataURL(audioFile);
                reader.onload = async () => {
                    const audioBase64 = reader.result;

                    const response = await fetch("https://hf.space", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            data: [ audioBase64, null, null, separateMusic ]
                        })
                    });

                    const result = await response.json();
                    
                    if(result.data) {
                        statusText.innerText = "اكتملت المعاينة الحقيقية بنجاح! استمع للمقطع بالأسفل:";
                        statusText.style.color = "#4ade80";
                        audioPlayer.src = result.data[0].url || result.data[0];
                        audioPlayer.style.display = "block";
                    } else {
                        throw new Error("خطأ في المعالجة السحابية");
                    }
                    btn.disabled = false;
                    btn.innerText = "ابدأ المعالجة وتشغيل المعاينة الفورية";
                };
            } catch (error) {
                statusText.innerText = "حدث تأخير أو خطأ في الاتصال، تأكد من تشغيل سيرفر Hugging Face.";
                statusText.style.color = "#f87171";
                btn.disabled = false;
                btn.innerText = "ابدأ المعالجة وتشغيل المعاينة الفورية";
            }
        }
    </script>
</body>
</html>
